name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["type/bug"]

body:
  - type: markdown
    attributes:
      value: |
        **Before filing:** Please search [existing issues](https://github.com/Improwised/jovVix/issues) — your bug may already be reported.

        For security vulnerabilities, see [SECURITY.md](../SECURITY.md) — report privately via email instead.

  - type: checkboxes
    id: searched
    attributes:
      label: Duplicate Check
      description: Confirm you've searched before filing
      options:
        - label: I have searched existing issues and discussions
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: dropdown
    id: bug-type
    attributes:
      label: Bug Type
      description: What category best describes this bug?
      options:
        - UI / Frontend
        - API / Backend
        - Real-time / WebSocket
        - Authentication / Auth
        - Database / Data
        - Performance
        - Build / CI
        - Docker / Deployment
        - Security
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Critical — data loss, security, or downtime
        - High — major feature broken
        - Medium — partial functionality affected
        - Low — cosmetic or minor issue
    validations:
      required: true

  - type: dropdown
    id: reproducible
    attributes:
      label: Reproducibility
      description: How often can you reproduce this bug?
      options:
        - Always
        - Sometimes
        - Rarely
        - Once
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Tell us what you expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Tell us what happened instead...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of jovVix is affected?
      options:
        - Quiz Creation
        - Quiz Playing / Real-time
        - Reports & Analytics
        - User Management / Auth
        - Admin Panel
        - API
        - Docker / Deployment
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: jovVix Version
      description: What version of jovVix are you using?
      placeholder: "e.g., latest, v1.2.3"
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Which browser are you using?
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      placeholder: "e.g., Ubuntu 22.04, macOS 14, Windows 11"
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Additional environment details (Docker version, Go version, Node version, etc.)
      placeholder: |
        - Docker: 24.0.7
        - Go: 1.22
        - Node: 22.9.0
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output. This will be automatically formatted as code.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: regression
    attributes:
      label: Regression
      description: Did this work before?
      options:
        - label: This worked in a previous version

  - type: textarea
    id: extrainfo
    attributes:
      label: Additional Context
      description: Is there anything else we should know about this bug?
    validations:
      required: false
